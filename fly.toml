# Fly.io — STAGING configuration only.
# BUZZ_IN_ENV is pinned to staging; src/config.js refuses production without
# an explicit BUZZ_IN_ALLOW_PROD override, which is deliberately not set here.
app = "buzz-in-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BUZZ_IN_ENV = "staging"
  BUZZ_IN_INTERRUPT_SHAPE = "ga"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
